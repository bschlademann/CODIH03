<!DOCTYPE html>
<html>
<head>
    <title>Currency App</title>
    <style>
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 10px; border: 1px solid #ccc; text-decoration: none; color: black; }
        .active { background-color: #eee; font-weight: bold; }
    </style>
</head>
<body>
    <h1>{% block headline %}Currency Converter{% endblock %}</h1>
    
    <nav class="tabs">
        <a href="{% url 'home' %}" class="tab">Converter</a>
        <a href="{% url 'rates_list' %}" class="tab">Exchange Rates</a>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
